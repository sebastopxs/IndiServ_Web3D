name: Build Android APK (Capacitor)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  secret-scan:
    name: Escaneo de Secretos (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Escanear secretos filtrados
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-android:
    name: Compilar IndiServ_Analytica.apk
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configurar Node.js 22 (requerido por Capacitor 8)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Configurar Java 21 (Capacitor 8 / Android Gradle)
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Instalar dependencias npm
        run: npm ci

      - name: Compilar aplicación Web (Vite)
        run: npm run build

      - name: Optimizar assets 3D para APK (eliminar modelos crudos sin uso)
        run: |
          rm -rf dist/models/pc.glb dist/models/source dist/models/textures
          ls -lh dist/models/

      - name: Sincronizar proyecto nativo Android con Capacitor
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Compilar APK instalable (Release firmado con R8 si hay keystore, sino Debug)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release.keystore
            export ANDROID_KEYSTORE_PATH="$PWD/release.keystore"
            ./gradlew assembleRelease
            cp app/build/outputs/apk/release/app-release.apk ../IndiServ_Analytica.apk
            rm -f release.keystore
          else
            ./gradlew assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../IndiServ_Analytica.apk
          fi

      - name: Subir APK como Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: IndiServ_Analytica-Android
          path: IndiServ_Analytica.apk
          if-no-files-found: error

      - name: Publicar APK público en GitHub Releases
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'android-latest' }}
          name: IndiServ Analytica — App Android (.apk)
          body: |
            Descarga directa de **IndiServ Analytica para Android** (Android 8.0+):
            - **Archivo**: `IndiServ_Analytica.apk`
            - **Instalación**: descarga el `.apk` en tu teléfono Android, ábrelo y permite **"Instalar apps desconocidas"** cuando Android lo solicite.
            - **Incluye**: Login/Registro con Política de Privacidad UNMSM, Escáner de dispositivo Android + Micro-Stress CPU móvil, Buscador de tickets de PC/Laptop en Supabase y Gemelo Digital 3D táctil.
          make_latest: true
          files: IndiServ_Analytica.apk
